<!doctype html>
<html class="min-h-full scroll-smooth" lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="瀏覽商品、加入購物車與送出訂單。" />
    <title>CRM SELECT</title>
  </head>
  <body class="m-0 min-w-80 bg-store-canvas font-store text-store-text">
    <div class="min-h-full" id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      id="chat-widget-script"
      src="__CHAT_WIDGET_URL__"
      data-client-id="__CHAT_WIDGET_CLIENT_ID__"
      defer
    ></script>
    <script>
      // 允許網址帶 ?company_id=xxx 在執行期覆寫聊天機器人身分，不用改建置設定就能讓
      // 同一個 corp-frontend 部署依網址顯示不同商家的聊天機器人／RAG 知識庫；沒帶這個
      // 參數時維持原本建置時寫死的 __CHAT_WIDGET_CLIENT_ID__。這段是一般 inline script
      // （沒有 defer），瀏覽器保證會在上面那個 defer script 執行前先跑完，
      // 所以改 data-client-id 一定來得及被 chat-widget/src/entry.tsx 讀到。
      (function () {
        var companyId = new URLSearchParams(window.location.search).get(
          "company_id",
        );
        if (!companyId) return;
        var widgetScript = document.getElementById("chat-widget-script");
        if (widgetScript)
          widgetScript.setAttribute("data-client-id", companyId);
      })();
    </script>
  </body>
</html>
